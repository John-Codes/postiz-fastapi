name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff httpx

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  docker:
    name: Docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the Postiz stack compose file
        run: |
          curl -fsSL https://raw.githubusercontent.com/gitroomhq/postiz-app/main/docker-compose.yaml -o /tmp/postiz-compose.yaml
          docker compose -f /tmp/postiz-compose.yaml config --quiet
